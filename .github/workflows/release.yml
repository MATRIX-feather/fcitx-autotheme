name: Rust Release

on:
  release:
    types:
      - published

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install musl target
      run: rustup target add x86_64-unknown-linux-musl

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --release --target x86_64-unknown-linux-musl

    - name: Run tests
      run: cargo test --verbose

    - name: Upload Release Assets
      # You may pin to the exact commit or the version.
      # uses: alexellis/upload-assets@13926a61cdb2cb35f5fdef1c06b8b591523236d3
      uses: alexellis/upload-assets@0.4.1
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        # The paths to the assets you want to upload as a JSON array. You can use a glob pattern.
        asset_paths: '[ "target/x86_64-unknown-linux-musl/release/fcitx-autotheme" ]'